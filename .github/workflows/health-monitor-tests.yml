name: Health monitor regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/check-production-health*.mjs"
      - ".github/workflows/health-monitor-tests.yml"
      - ".github/workflows/production-health.yml"
      - "package.json"

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test monitor without production requests
        run: node --test scripts/check-production-health.test.mjs
