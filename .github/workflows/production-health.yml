name: Production health

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify production safety and configuration
        run: node scripts/check-production-health.mjs
